<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Удирдлагын самбар</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="demo" id="demo" style="display:none">Туршилтын горим — зөвхөн энэ төхөөрөмж дээр бичигдсэн мэдээлэл харагдана (код: 0000)</div>

<div class="login" id="login">
  <div class="ico mono">N</div>
  <h1>Удирдлагын самбар</h1>
  <p class="muted">Миний компаниуд · Санхүү · Бараа материал · Ажилчид</p>
  <div class="card" style="text-align:left">
    <label for="userInput">Нэвтрэх нэр</label>
    <input id="userInput" autocomplete="username" autocapitalize="none" spellcheck="false" onkeydown="if(event.key==='Enter')$('passInput').focus()">
    <label for="passInput">Нууц код</label>
    <input id="passInput" type="password" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <p class="muted" id="loginMsg" style="margin-top:8px;min-height:20px;color:var(--red)"></p>
    <button class="btn" id="loginBtn" onclick="doLogin()">Нэвтрэх</button>
  </div>
</div>

<div id="main" style="display:none">
  <div class="top">
    <div class="ico mono">N</div>
    <div><h1>Удирдлагын самбар</h1><small id="updated"></small></div>
    <div class="right"><div id="ownerName"></div><button onclick="refresh()">Шинэчлэх</button> <button onclick="logout()">Гарах</button></div>
  </div>
  <nav class="topnav">
    <button data-v="companies" onclick="go('companies')">Миний компаниуд</button>
    <button data-v="staff" onclick="go('staff')">Ажилчид <span class="badge" id="pendingBadge"></span></button>
  </nav>
  <div class="wrap wide" id="view"></div>
</div>

<!-- Ажилтан засах -->
<div class="sheet" id="staffSheet" onclick="if(event.target===this)closeSheet('staffSheet')">
  <div class="panel">
    <h2 id="sfTitle">Ажилтан</h2>
    <p class="muted" id="sfSub"></p>
    <div class="row2">
      <div><label for="sfStatus">Төлөв</label>
        <select id="sfStatus"><option>Тийм</option><option>Хүлээгдэж</option><option>Үгүй</option></select></div>
      <div><label for="sfRole">Эрх</label>
        <select id="sfRole"><option>Худалдагч</option><option>Менежер</option><option>Эзэн</option></select></div>
    </div>
    <div class="row2">
      <div><label for="sfBiz">Дэлгүүр</label><select id="sfBiz"></select></div>
      <div><label for="sfPos">Албан тушаал</label><input id="sfPos"></div>
    </div>
    <div class="row2">
      <div><label for="sfSalary">Үндсэн цалин (₮/сар)</label><input id="sfSalary" type="number" inputmode="numeric" min="0"></div>
      <div><label for="sfPhone">Утас</label><input id="sfPhone" inputmode="tel"></div>
    </div>
    <label for="sfBank">Цалингийн данс</label><input id="sfBank">
    <div class="row2">
      <div><label for="sfUser">Нэвтрэх нэр</label><input id="sfUser" autocapitalize="none" spellcheck="false"></div>
      <div><label for="sfCode">Шинэ нууц код (солих бол)</label>
        <input id="sfCode" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" placeholder="••••"></div>
    </div>
    <button class="btn" onclick="saveStaff()">Хадгалах</button>
    <button class="btn ghost" onclick="closeSheet('staffSheet')">Болих</button>
  </div>
</div>

<!-- Цалингийн гүйлгээ -->
<div class="sheet" id="salSheet" onclick="if(event.target===this)closeSheet('salSheet')">
  <div class="panel">
    <h2 id="slTitle">Цалингийн гүйлгээ</h2>
    <label>Төрөл</label>
    <div class="seg seg4" id="slKind">
      <button data-v="Урьдчилгаа" onclick="setKind(this)">Урьдчилгаа</button>
      <button data-v="Олгосон" onclick="setKind(this)">Олгосон</button>
      <button data-v="Шагнал" onclick="setKind(this)">Шагнал</button>
      <button data-v="Суутгал" onclick="setKind(this)">Суутгал</button>
    </div>
    <div class="row2">
      <div><label for="slAmount">Дүн (₮)</label><input id="slAmount" type="number" inputmode="numeric" min="0"></div>
      <div><label for="slMonth">Сар</label><input id="slMonth" type="month"></div>
    </div>
    <label for="slNote">Тайлбар</label><input id="slNote" placeholder="Жишээ: 10-р сарын урьдчилгаа">
    <ul class="list card" id="slHistory" style="margin-top:12px"></ul>
    <button class="btn" onclick="saveSalary()">Хадгалах</button>
    <button class="btn ghost" onclick="closeSheet('salSheet')">Хаах</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="products.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
